services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: giljabi
      POSTGRES_USER: giljabi
      POSTGRES_PASSWORD: giljabi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giljabi -d giljabi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: